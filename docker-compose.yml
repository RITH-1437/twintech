version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: twintech-app

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - ./backend:/var/www

    depends_on:
      - postgres

    networks:
      - twintech

  nginx:
    image: nginx:latest

    container_name: twintech-nginx

    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - twintech

  postgres:
    image: postgres:17

    container_name: twintech-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: twintech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - twintech

  pgadmin:
    image: dpage/pgadmin4

    container_name: twintech-pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@twintech.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

    networks:
      - twintech

volumes:
  postgres_data:

networks:
  twintech:
